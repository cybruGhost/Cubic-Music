name: Cubic Music Engineering Activity

on:
  schedule:
    # 8 runs every UTC hour: 192 runs per day
    - cron: "6,13,20,27,34,41,48,55 * * * *"
    # 8 additional runs spread across the day: 200 planned runs
    - cron: "0 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Preview the next source-reference entry without committing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cubic-engineering-activity-main
  cancel-in-progress: false

jobs:
  track-repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Cubic Music
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create a transparent source-inventory entry
        id: inventory
        env:
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only || false }}
        run: python3 .github/scripts/cubic_activity.py
      - name: Commit one inventory entry
        if: steps.inventory.outputs.commit_ready == 'true'
        env:
          COMMIT_SUBJECT: ${{ steps.inventory.outputs.subject }}
        run: |
          set -euo pipefail
          git config user.name "cybruGhost"
          git config user.email "113809799+cybruGhost@users.noreply.github.com"
          git add -- automation/engineering-activity/
          git commit -m "$COMMIT_SUBJECT"
          git pull --rebase origin main
          git push origin HEAD:main
